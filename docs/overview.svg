<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>What the coach does</title>
  <desc>A WHOOP band's data and what you tell the coach flow into a rules engine, an agent loop and a memory; the coach talks to you in a messaging app, speaking first when something matters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#14263a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#7dd3c8"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Headline -->
  <text x="40" y="34" font-size="15" font-weight="700" letter-spacing="2.4" fill="#2dd4bf">WHOOP-YOUR-SPOTTER</text>
  <text x="40" y="70" font-size="34" font-weight="700" fill="#f1f5f9">A proactive, memory-backed fitness agent</text>
  <text x="40" y="100" font-size="20" fill="#94a9bf">that lives in a messaging app and reads your WHOOP data</text>

  <!-- LEFT: inputs -->
  <g>
    <rect x="40" y="136" width="350" height="400" rx="18" fill="#17304a" stroke="#27506f"/>
    <text x="64" y="170" font-size="12" font-weight="700" letter-spacing="1.6" fill="#7dd3c8">1 · IT READS</text>
    <text x="64" y="196" font-size="18" font-weight="600" fill="#f1f5f9">Your WHOOP data</text>

    <!-- metric rows (illustrative values) -->
    <g font-size="14" fill="#cbd8e6">
      <text x="64" y="236">Recovery</text>
      <rect x="160" y="224" width="140" height="10" rx="5" fill="#0d1b2a"/>
      <rect x="160" y="224" width="100" height="10" rx="5" fill="#34d399"/>
      <text x="316" y="236" font-weight="600" fill="#f1f5f9">72%</text>

      <text x="64" y="270">Sleep</text>
      <rect x="160" y="258" width="140" height="10" rx="5" fill="#0d1b2a"/>
      <rect x="160" y="258" width="118" height="10" rx="5" fill="#60a5fa"/>
      <text x="316" y="270" font-weight="600" fill="#f1f5f9">84%</text>

      <text x="64" y="304">Strain</text>
      <rect x="160" y="292" width="140" height="10" rx="5" fill="#0d1b2a"/>
      <rect x="160" y="292" width="76" height="10" rx="5" fill="#fbbf24"/>
      <text x="316" y="304" font-weight="600" fill="#f1f5f9">11.4</text>

      <text x="64" y="338">HRV</text>
      <rect x="160" y="326" width="140" height="10" rx="5" fill="#0d1b2a"/>
      <rect x="160" y="326" width="96" height="10" rx="5" fill="#a78bfa"/>
      <text x="316" y="338" font-weight="600" fill="#f1f5f9">58 ms</text>
    </g>

    <line x1="64" y1="364" x2="366" y2="364" stroke="#27506f"/>
    <text x="64" y="394" font-size="18" font-weight="600" fill="#f1f5f9">Whatever you tell it</text>
    <text x="64" y="418" font-size="13" fill="#94a9bf">One sentence, any time. No form.</text>

    <g font-size="13" fill="#e2ecf5">
      <rect x="64" y="436" width="86" height="28" rx="14" fill="#0d1b2a" stroke="#27506f"/>
      <text x="107" y="455" text-anchor="middle">🍷 drinks</text>
      <rect x="158" y="436" width="86" height="28" rx="14" fill="#0d1b2a" stroke="#27506f"/>
      <text x="201" y="455" text-anchor="middle">☕ caffeine</text>
      <rect x="252" y="436" width="74" height="28" rx="14" fill="#0d1b2a" stroke="#27506f"/>
      <text x="289" y="455" text-anchor="middle">🍳 meals</text>
      <rect x="64" y="472" width="86" height="28" rx="14" fill="#0d1b2a" stroke="#27506f"/>
      <text x="107" y="491" text-anchor="middle">🙂 mood</text>
      <rect x="158" y="472" width="86" height="28" rx="14" fill="#0d1b2a" stroke="#27506f"/>
      <text x="201" y="491" text-anchor="middle">📝 notes</text>
    </g>
  </g>

  <!-- arrow left -> center -->
  <line x1="396" y1="336" x2="440" y2="336" stroke="#7dd3c8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- CENTER: the agent -->
  <g>
    <rect x="446" y="136" width="380" height="400" rx="18" fill="#17304a" stroke="#27506f"/>
    <text x="470" y="170" font-size="12" font-weight="700" letter-spacing="1.6" fill="#7dd3c8">2 · IT THINKS</text>
    <text x="470" y="196" font-size="18" font-weight="600" fill="#f1f5f9">One small Python app</text>

    <rect x="470" y="216" width="332" height="82" rx="12" fill="#0d1b2a" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="488" y="244" font-size="15" font-weight="700" fill="#fbbf24">Rules engine</text>
    <text x="488" y="266" font-size="13" fill="#cbd8e6">Plain if/then code, checked every 5 minutes.</text>
    <text x="488" y="284" font-size="13" fill="#cbd8e6">Wakes the AI only when something matters.</text>

    <rect x="470" y="312" width="332" height="82" rx="12" fill="#0d1b2a" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="488" y="340" font-size="15" font-weight="700" fill="#34d399">Agent loop + tools (MCP)</text>
    <text x="488" y="362" font-size="13" fill="#cbd8e6">Decides which data it needs, fetches it step</text>
    <text x="488" y="380" font-size="13" fill="#cbd8e6">by step, then answers in plain words.</text>

    <rect x="470" y="408" width="332" height="82" rx="12" fill="#0d1b2a" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="488" y="436" font-size="15" font-weight="700" fill="#a78bfa">Memory</text>
    <text x="488" y="458" font-size="13" fill="#cbd8e6">Your logs and history in one SQLite file, so</text>
    <text x="488" y="476" font-size="13" fill="#cbd8e6">advice gets more personal every week.</text>

    <text x="470" y="518" font-size="11.5" fill="#94a9bf">Rules decide when · agent decides what · memory keeps why</text>
  </g>

  <!-- arrow center <-> phone -->
  <line x1="832" y1="336" x2="876" y2="336" stroke="#7dd3c8" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- RIGHT: chat -->
  <g>
    <rect x="882" y="136" width="358" height="400" rx="18" fill="#17304a" stroke="#27506f"/>
    <text x="906" y="170" font-size="12" font-weight="700" letter-spacing="1.6" fill="#7dd3c8">3 · IT TALKS</text>
    <text x="906" y="196" font-size="18" font-weight="600" fill="#f1f5f9">In the app you already use</text>

    <!-- coach proactive bubble -->
    <rect x="906" y="214" width="268" height="86" rx="14" fill="#0d1b2a" stroke="#fbbf24" stroke-opacity="0.7"/>
    <rect x="918" y="224" width="92" height="18" rx="9" fill="#fbbf24"/>
    <text x="964" y="237" font-size="10" font-weight="700" text-anchor="middle" fill="#0d1b2a" letter-spacing="0.6">SPOKE FIRST</text>
    <text x="918" y="262" font-size="13" fill="#e2ecf5">Morning. Recovery 72%, HRV above</text>
    <text x="918" y="280" font-size="13" fill="#e2ecf5">your baseline. Target strain: 10–13.</text>

    <!-- user bubble -->
    <rect x="952" y="312" width="262" height="58" rx="14" fill="#2563eb"/>
    <text x="966" y="336" font-size="13" fill="#ffffff">Can I have two drinks tonight and</text>
    <text x="966" y="354" font-size="13" fill="#ffffff">still train hard tomorrow?</text>

    <!-- coach answer bubble -->
    <rect x="906" y="382" width="294" height="140" rx="14" fill="#0d1b2a" stroke="#34d399" stroke-opacity="0.7"/>
    <rect x="918" y="392" width="136" height="18" rx="9" fill="#34d399"/>
    <text x="986" y="405" font-size="10" font-weight="700" text-anchor="middle" fill="#0d1b2a" letter-spacing="0.6">USED YOUR HISTORY</text>
    <text x="918" y="432" font-size="13" fill="#e2ecf5">Last time you had two drinks, your</text>
    <text x="918" y="450" font-size="13" fill="#e2ecf5">sleep score fell from 84 to 63.</text>
    <text x="918" y="472" font-size="13" fill="#e2ecf5">With tomorrow's hard session, stick</text>
    <text x="918" y="490" font-size="13" fill="#e2ecf5">to one and be in bed by 22:30.</text>
  </g>

  <!-- Bottom strip -->
  <g font-size="14" fill="#cbd8e6">
    <text x="40" y="580"><tspan font-weight="700" fill="#fbbf24">Proactive</tspan> · morning brief · log nudges · evening check-in · alerts</text>
    <text x="40" y="606"><tspan font-weight="700" fill="#34d399">Conversational</tspan> · ask anything · log in one sentence</text>
    <text x="1240" y="580" text-anchor="end"><tspan font-weight="700" fill="#a78bfa">$0 / month</tspan> · runs 24/7 · no public URL</text>
    <text x="1240" y="606" text-anchor="end" fill="#94a9bf">Example numbers are illustrative. Unofficial, not affiliated with WHOOP.</text>
  </g>
</svg>
