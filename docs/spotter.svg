<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Whoop-your-Spotter</title>
  <desc>A WHOOP-style band sends heart and recovery data to an AI spotter, drawn as a glowing node with two hands reaching up under a barbell. The spotter speaks first in a chat and answers questions using your history.</desc>
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#14263a"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-bg)"/>

  <!-- TITLE: swap the name here when it is final (and in <title> above) -->
  <text x="64" y="108" font-size="66" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Whoop-your-<tspan fill="#2dd4bf">Spotter</tspan></text>
  <text x="64" y="158" font-size="23" fill="#cbd8e6">A proactive, memory-backed fitness agent</text>
  <text x="64" y="190" font-size="23" fill="#94a9bf">that lives in a messaging app and reads your WHOOP data</text>

  <!-- ===== band (generic wearable, no brand marks) ===== -->
  <g>
    <rect x="52" y="378" width="264" height="58" rx="29" fill="#1c3550" stroke="#2b5278" stroke-width="2"/>
    <g stroke="#2b5278" stroke-width="2" opacity="0.8">
      <line x1="76" y1="384" x2="76" y2="430"/><line x1="96" y1="384" x2="96" y2="430"/><line x1="116" y1="384" x2="116" y2="430"/>
      <line x1="252" y1="384" x2="252" y2="430"/><line x1="272" y1="384" x2="272" y2="430"/><line x1="292" y1="384" x2="292" y2="430"/>
    </g>
    <rect x="132" y="356" width="104" height="102" rx="24" fill="#0b1522" stroke="#2dd4bf" stroke-width="2.5"/>
    <circle cx="160" cy="390" r="6" fill="#34d399"/>
    <circle cx="184" cy="390" r="6" fill="#34d399" opacity="0.55"/>
    <circle cx="208" cy="390" r="6" fill="#34d399" opacity="0.25"/>
    <path d="M150 428 H166 L173 414 L183 442 L192 420 L197 428 H218" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="184" y="490" font-size="15" text-anchor="middle" fill="#94a9bf">your WHOOP band</text>
  </g>

  <!-- ===== data flowing to the spotter ===== -->
  <path d="M322 407 H372 L384 376 L400 440 L414 398 L424 407 H560" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 7" opacity="0.9"/>
  <text x="440" y="452" font-size="13" text-anchor="middle" fill="#94a9bf">recovery · sleep · strain · HRV</text>
  <text x="440" y="470" font-size="13" text-anchor="middle" fill="#94a9bf">+ what you tell it</text>

  <!-- ===== barbell ===== -->
  <g>
    <line x1="480" y1="282" x2="800" y2="282" stroke="#cbd8e6" stroke-width="9" stroke-linecap="round"/>
    <rect x="504" y="240" width="20" height="84" rx="5" fill="#94a9bf"/>
    <rect x="530" y="252" width="15" height="60" rx="4" fill="#cbd8e6"/>
    <rect x="756" y="240" width="20" height="84" rx="5" fill="#94a9bf"/>
    <rect x="735" y="252" width="15" height="60" rx="4" fill="#cbd8e6"/>
  </g>

  <!-- ===== the spotter ===== -->
  <circle cx="640" cy="418" r="120" fill="url(#sp-glow)"/>
  <!-- hands reaching up to the bar -->
  <path d="M598 380 C578 360 580 322 604 292" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round"/>
  <path d="M682 380 C702 360 700 322 676 292" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round"/>
  <circle cx="604" cy="292" r="8" fill="#2dd4bf"/>
  <circle cx="676" cy="292" r="8" fill="#2dd4bf"/>
  <circle cx="640" cy="418" r="64" fill="#17304a" stroke="#2dd4bf" stroke-width="3.5"/>
  <circle cx="640" cy="418" r="50" fill="#0d1b2a" stroke="#27506f" stroke-width="1.5"/>
  <!-- four-point spark = the intelligence -->
  <path d="M640 384 C643 408 650 415 676 418 C650 421 643 428 640 452 C637 428 630 421 604 418 C630 415 637 408 640 384 Z" fill="#fbbf24"/>
  <circle cx="668" cy="386" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="614" cy="450" r="3" fill="#fbbf24" opacity="0.6"/>
  <text x="640" y="516" font-size="17" font-weight="700" text-anchor="middle" fill="#f1f5f9">the spotter</text>
  <text x="640" y="538" font-size="13" text-anchor="middle" fill="#94a9bf">watches, remembers, steps in</text>

  <!-- ===== chat ===== -->
  <g>
    <rect x="852" y="236" width="364" height="96" rx="16" fill="#0d1b2a" stroke="#fbbf24" stroke-opacity="0.75"/>
    <rect x="866" y="247" width="94" height="19" rx="9.5" fill="#fbbf24"/>
    <text x="913" y="260.5" font-size="10" font-weight="700" text-anchor="middle" fill="#0d1b2a" letter-spacing="0.6">SPOKE FIRST</text>
    <text x="866" y="288" font-size="14" fill="#e2ecf5">Recovery is 38% this morning.</text>
    <text x="866" y="308" font-size="14" fill="#e2ecf5">Keep today light. I've got you.</text>

    <rect x="920" y="346" width="296" height="62" rx="16" fill="#2563eb"/>
    <text x="936" y="372" font-size="14" fill="#ffffff">Three drinks last night. Can I</text>
    <text x="936" y="392" font-size="14" fill="#ffffff">still lift heavy?</text>

    <rect x="852" y="422" width="364" height="116" rx="16" fill="#0d1b2a" stroke="#34d399" stroke-opacity="0.75"/>
    <rect x="866" y="433" width="140" height="19" rx="9.5" fill="#34d399"/>
    <text x="936" y="446.5" font-size="10" font-weight="700" text-anchor="middle" fill="#0d1b2a" letter-spacing="0.6">USED YOUR HISTORY</text>
    <text x="866" y="474" font-size="14" fill="#e2ecf5">Last time, your sleep score fell</text>
    <text x="866" y="494" font-size="14" fill="#e2ecf5">20 points. Cap strain at 11 and</text>
    <text x="866" y="514" font-size="14" fill="#e2ecf5">stop a rep early. I'll be watching.</text>
  </g>

  <!-- footer -->
  <g font-size="14">
    <text x="64" y="598" fill="#cbd8e6"><tspan font-weight="700" fill="#fbbf24">Proactive</tspan> · <tspan font-weight="700" fill="#34d399">Conversational</tspan> · <tspan font-weight="700" fill="#a78bfa">Remembers</tspan> · $0 / month</text>
    <text x="1216" y="598" text-anchor="end" fill="#94a9bf">Example numbers are illustrative. Unofficial, not affiliated with WHOOP.</text>
  </g>
</svg>
